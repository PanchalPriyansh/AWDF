name: Task Management CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # JOB 1: Code Linting & Static Analysis (Supplementary Problem 1)
  # ============================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: student-portfolio/package.json

      - name: Install Frontend Dependencies
        working-directory: ./student-portfolio
        run: npm install

      - name: Execute Linter (Oxlint / ESLint rules)
        working-directory: ./student-portfolio
        run: npm run lint

  # ============================================================================
  # JOB 2: Automated Testing & Verification (Core Objective & Step 2)
  # Depends on the lint job completing successfully first
  # ============================================================================
  test:
    name: Backend API Automated Tests
    needs: lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: task-manager-api/package.json

      - name: Install Backend Dependencies
        working-directory: ./task-manager-api
        run: npm install

      - name: Execute Automated Test Suite (Jest & Supertest)
        working-directory: ./task-manager-api
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/task_manager_db
          JWT_SECRET: charusat_awdf_jwt_secret_key_sem5_2026
          JWT_EXPIRES_IN: 1h
        run: npm test
