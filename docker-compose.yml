# ==============================================================================
# Full-Stack Task Management Application Orchestration (Practical 11)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database Container
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: task_manager_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=task_manager_db
    volumes:
      # Supplementary Problem 3: Named volume ensuring persistent storage across container restarts
      - mongodb_data:/data/db
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 2. Node/Express Backend API Container
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./task-manager-api
      dockerfile: Dockerfile
    container_name: task_manager_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task_manager_db
      - JWT_SECRET=charusat_awdf_jwt_secret_key_sem5_2026
      - JWT_EXPIRES_IN=1h
    depends_on:
      - mongodb
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # 3. React Frontend Container (Multi-Stage Build)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./student-portfolio
      dockerfile: Dockerfile
    container_name: task_manager_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# ------------------------------------------------------------------------------
# Dedicated Bridge Network for Container Intercommunication
# ------------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge

# ------------------------------------------------------------------------------
# Named Persistent Storage Volume (Supplementary Problem 3)
# ------------------------------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
